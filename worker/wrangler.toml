name = "x-feed-share"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Create with `npx wrangler d1 create xfeeds` and paste the id here. Any id works for --local.
[[d1_databases]]
binding = "DB"
database_name = "xfeeds"
database_id = "00000000-0000-0000-0000-000000000000"

# Daily expiry and garbage collection.
[triggers]
crons = ["17 3 * * *"]

# Feed creation, per client IP.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "7101"
simple = { limit = 2, period = 60 }

# Uploads, per feed. The client sends at most 2 batches every 30 s.
[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "7102"
simple = { limit = 10, period = 60 }
