name = "x-feed-share"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Created with `npx wrangler d1 create xfeeds`. Local dev (--local) uses its own copy.
[[d1_databases]]
binding = "DB"
database_name = "xfeeds"
database_id = "d1680c6f-b523-466f-8829-091d7a50ada8"

# Daily expiry and garbage collection.
[triggers]
crons = ["17 3 * * *"]

# Feed creation, per client IP.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "7101"
simple = { limit = 2, period = 60 }

# Verification checks, per feed. Each one makes a single request to X's public oEmbed endpoint.
[[ratelimits]]
name = "VERIFY_LIMIT"
namespace_id = "7104"
simple = { limit = 10, period = 60 }

# Searches, per client IP.
[[ratelimits]]
name = "SEARCH_LIMIT"
namespace_id = "7103"
simple = { limit = 30, period = 60 }

# Uploads, per feed. The client sends at most 2 batches every 30 s.
[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "7102"
simple = { limit = 10, period = 60 }
